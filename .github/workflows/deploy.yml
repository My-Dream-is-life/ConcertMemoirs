name: Deploy with QQ Bot Notification

on:
  push:
    branches: [feature/ci-cd]
  pull_request:
    types: [opened]
    branches: [feature/ci-cd]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup and Test
        run: |
          echo "Running setup and tests..."
          # 你的安装和测试命令

      - name: Deploy
        run: |
          echo "Deploying..."
          # 你的部署命令

      - name: Send Success Notification
        if: success()
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "platform": "qq",
              "event": "deploy",
              "status": "success",
              "title": "✅ 部署成功",
              "message": "项目部署完成",
              "repository": "${{ github.repository }}",
              "branch": "${{ github.ref_name }}",
              "commit_short": "${{ github.sha }}",
              "author": "${{ github.actor }}",
              "time": "${{ github.event.head_commit.timestamp }}",
              "run_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }' \
            "${{ secrets.QQ_BOT_WEBHOOK }}"

      - name: Send Failure Notification
        if: failure()
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "platform": "qq",
              "event": "deploy",
              "status": "failure",
              "title": "❌ 部署失败",
              "message": "部署过程中出现错误",
              "repository": "${{ github.repository }}",
              "branch": "${{ github.ref_name }}",
              "author": "${{ github.actor }}",
              "run_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "error_step": "${{ job.status }}"
            }' \
            "${{ secrets.QQ_BOT_WEBHOOK }}"
