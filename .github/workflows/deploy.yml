# This is a basic workflow to help you get started with Actions

name: CI build and deploy to tencent cloud server

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  # Currently, it is in the testing branch
  push:
    branches: [feature/ci-cd]
  pull_request:
    types: [opened]
    branches: [feature/ci-cd]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Get variables
      - name: Prepare variables
        id: prepare
        env:
          REPOSITORY: ${{ github.repository }}
          PUSH_TIME_RAW: ${{ github.event.head_commit.timestamp }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Format commit SHA
          SHA="${GITHUB_SHA:0:7}"

          # Format push time
          if [[ -n "$PUSH_TIME_RAW" ]]; then
            PUSH_TIME_FORMATTED=$(date -d "$PUSH_TIME_RAW" '+%Y-%m-%d %H:%M:%S' 2>/dev/null || echo "$PUSH_TIME_RAW")
          else
            PUSH_TIME_FORMATTED=$(date '+%Y-%m-%d %H:%M:%S')
          fi

          # Output variables
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "push_time=$PUSH_TIME_FORMATTED" >> $GITHUB_OUTPUT
          echo "url=https://github.com/$REPOSITORY/actions/runs/$RUN_ID" >> $GITHUB_OUTPUT

      # Extract the code and use this Action to be able to pull the latest code
      # Checks-out your repository under $GITHUB_WORKSPACE
      - uses: actions/checkout@v4

      # Robot notification test
      - name: Robot group notify
        env:
          GROUP_ID: '758201611'
          PROJECT: ${{ github.event.repository.name }}
          BRANCH: ${{ github.ref_name }}
          AUTHOR: ${{ github.actor }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATUS_EMOJI="✅"
            STATUS_TEXT="success"
          else
            STATUS_EMOJI="❌"
            STATUS_TEXT="failed"
          fi

          # Use heredoc to build JSON data
          # Avoid complex quotation mark escaping
          JSON_DATA=$(cat << EOF
          {
            "type": "group_message",
            "data": {
              "groupId": "${GROUP_ID}",
              "message": [
                {
                  "type": "text",
                  "data": {
                    "text": "${STATUS_EMOJI} GitHub Actions build ${STATUS_TEXT}\\nProject: ${PROJECT}\\nBranch: ${BRANCH}\\nCommit: ${{ steps.prepare.outputs.sha }}\\nAuthor: ${AUTHOR}\\nEnd Time: ${{ steps.prepare.outputs.push_time }}\\nURL: ${{ steps.prepare.outputs.url }}"
                  }
                }
              ]
            }
          }
          EOF
          )

          curl -X POST "${{ secrets.QQ_BOT_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "${JSON_DATA}"
