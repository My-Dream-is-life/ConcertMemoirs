# This is a basic workflow to help you get started with Actions

name: CI build and deploy to tencent cloud server

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  # Currently, it is in the testing branch
  push:
    branches: [feature/ci-cd]
  pull_request:
    types: [opened]
    branches: [feature/ci-cd]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Get variables
      - name: Prepare variables
        id: prepare
        env:
          PUSH_TIME_RAW: ${{ github.event.head_commit.timestamp }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Get commit SHA
          SHA="${GITHUB_SHA:0:7}"

          # Format push time
          if [[ -n "$PUSH_TIME_RAW" ]]; then
            PUSH_TIME_FORMATTED=$(date -d "$PUSH_TIME_RAW" '+%Y-%m-%d %H:%M:%S' 2>/dev/null || echo "$PUSH_TIME_RAW")
          else
            PUSH_TIME_FORMATTED=$PUSH_TIME_RAW
          fi

          # Output variables
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "push_time=$PUSH_TIME_FORMATTED" >> $GITHUB_OUTPUT
          echo "url=https://github.com/$REPOSITORY/actions/runs/$RUN_ID" >> $GITHUB_OUTPUT

      # Robot test notification
      - name: Robot notify start
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.QQ_BOT_TOKEN }}
          token: ${{ secrets.QQ_BOT_TOKEN }}
          message: |
            🚀 GitHub actions build start
            ────────────────────────────
            📦 Project: ${{ github.event.repository.name }}
            🌿 Branch: ${{ github.ref }}
            🆔 Commit: ${{ steps.prepare.outputs.sha }}
            👤 Author: ${{ github.actor }}
            ⏰ End Time: ${{ steps.prepare.outputs.push_time }}
            📝 Commit Message: ${{ github.event.head_commit.message }}
            ────────────────────────────
            Build progress view: ${{ steps.prepare.outputs.url }}
        if: always()

      # Extract the code and use this Action to be able to pull the latest code
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2

      # Robot test success
      - name: Robot notify success
        if: success()
        uses: distributhor/workflow-webhook@v3
        env:
          WEBHOOK_URL: ${{ secrets.QQ_BOT_WEBHOOK }}
          WEBHOOK_SECRET: ''
        with:
          data: |
            {
              "msg_type": "text",
              "content": {
                "text": "✅ GitHub actions build success\nProject: ${{ github.event.repository.name }}\nBranch: ${{ github.ref }}\nCommit: ${{ steps.prepare.outputs.sha }}\nAuthor: ${{ github.actor }}\nEnd Time: ${{ steps.prepare.outputs.push_time }}\nURL: ${{ steps.prepare.outputs.url }}"
              }
            }

      # Robot test fail
      - name: Robot notify fail
        if: failure()
        uses: distributhor/workflow-webhook@v3
        env:
          WEBHOOK_URL: ${{ secrets.QQ_BOT_WEBHOOK }}
          WEBHOOK_SECRET: ''
        with:
          data: |
            {
              "msg_type": "text",
              "content": {
                "text": "❌ GitHub actions build fail\nProject: ${{ github.event.repository.name }}\nBranch: ${{ github.ref }}\nCommit: ${{ steps.prepare.outputs.sha }}\nAuthor: ${{ github.actor }}\nEnd Time: ${{ steps.prepare.outputs.push_time }}\nURL: ${{ steps.prepare.outputs.url }}"
              }
            }
