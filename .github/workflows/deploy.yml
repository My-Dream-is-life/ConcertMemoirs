# This is a basic workflow to help you get started with Actions

name: CI build and deploy to tencent cloud server

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  # Currently, it is in the testing branch
  push:
    branches: [feature/ci-cd]
  pull_request:
    types: [opened]
    branches: [feature/ci-cd]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  notify_qq:
    runs-on: ubuntu-latest
    steps:
      - name: Send Notification to QQ
        env:
          QQ_WEBHOOK_URL: ${{ secrets.QQ_BOT_WEBHOOK }}
        run: |
          curl -X POST ${{ env.QQ_WEBHOOK_URL }} \
              -H 'Content-Type: application/json' \
              -d '{
                    "markdown": {
                      "content": "> **GitHub Actions 通知** \n\n 状态：成功 \n\n [点击查看详情](github.com{{ github.repository }}/actions)"
                    }
                  }'
